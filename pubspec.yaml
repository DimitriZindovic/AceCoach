name: ace_coach
description: "AceCoach - AI-generated tennis training sessions that adapt to today's weather."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.1

  # Firebase (auth + Gemini through Firebase AI Logic)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_ai: ^4.0.0
  google_sign_in: ^7.2.0

  # HTTP
  dio: ^5.11.1

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local storage
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # Utilities
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

  # Lints (riverpod_lint 3.1+ is a native analyzer plugin, no custom_lint needed)
  riverpod_lint: ^3.1.9

  # Tests
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    # Poppins bundled so google_fonts never needs the network (OFL licence).
    - assets/google_fonts/
