name: ace_coach
description: "AceCoach - login screen with Firebase authentication."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  go_router: ^18.0.1

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_ai: ^4.0.0

  dio: ^5.11.1

  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/google_fonts/
